title: Value written under a Run key
id: s04-reg-run-key
status: test
description: |
  HKCU/HKLM ...\CurrentVersion\Run starts a program at every logon. Plenty of
  legitimate software does this; the question is always what the value runs
  and from where.
references:
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
      - '\CurrentVersion\Run\'
      - '\CurrentVersion\RunOnce\'
  filter_onedrive:
    Details|endswith: '\OneDrive.exe" /background'
  condition: selection and not filter_onedrive
falsepositives:
  - Software updaters, chat clients, sync clients
level: medium
