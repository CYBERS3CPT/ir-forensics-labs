title: LSASS memory dump with comsvcs.dll MiniDump
id: s04-proc-comsvcs-minidump
status: test
description: |
  comsvcs.dll exports MiniDump (ordinal #24). Calling it through rundll32 with
  the PID of lsass writes a full credential dump with nothing but Windows.
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_dll:
    CommandLine|contains: 'comsvcs'
  selection_fn:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
      - '#+24'
  condition: selection_dll and selection_fn
falsepositives:
  - Practically none
level: critical
