title: rundll32 running a DLL from a user-writable temp folder
id: s04-proc-rundll32-temp
status: test
description: |
  rundll32 is a signed Windows binary that will run an exported function of
  any DLL. A DLL in %TEMP% or Downloads is almost never part of an installed
  product.
references:
  - https://attack.mitre.org/techniques/T1218/011/
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\rundll32.exe'
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\Downloads\'
      - '\Users\Public\'
  filter_comsvcs:
    CommandLine|contains: 'comsvcs.dll'
  condition: selection_img and selection_path and not filter_comsvcs
falsepositives:
  - Installers that unpack a helper DLL into %TEMP% and call it once
level: high
